  <style>
    /* v0.12 — Video Field Notes */
    .video-field-note {
      position: relative;
      max-width: 820px;
      margin: 54px auto 0;
      padding: 0;
      color: #1f1d1b;
    }

    .video-field-note details {
      position: relative;
      overflow: visible;
      background:
        linear-gradient(rgba(255,255,255,.72), rgba(255,255,255,.72)),
        repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 29px,
          rgba(40,116,147,.11) 30px,
          rgba(40,116,147,.11) 31px
        ),
        #fbf7ed;
      border: 1px solid rgba(31,29,27,.17);
      border-radius: 6px 18px 10px 14px;
      box-shadow:
        0 16px 35px rgba(31,29,27,.10),
        0 3px 0 rgba(31,29,27,.04);
      transform: rotate(-.25deg);
    }

    .video-field-note details::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
      background:
        linear-gradient(90deg, transparent 0 54px, rgba(188,83,83,.18) 54px 56px, transparent 56px);
      opacity: .85;
    }

    .video-field-note summary {
      font-style: normal;
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      align-items: end;
      min-height: 190px;
      padding: 34px 34px 30px 82px;
      cursor: pointer;
      list-style: none;
    }

    .video-field-note summary::-webkit-details-marker {
      display: none;
    }

    .video-field-note summary:focus-visible {
      outline: 3px solid #287493;
      outline-offset: 5px;
      border-radius: 8px;
    }

    .video-field-note .field-note-clip {
      position: absolute;
      top: -31px;
      left: 20px;
      width: 58px;
      height: 58px;
      z-index: 3;
    }

    .video-field-note-copy {
      min-width: 0;
    }

    .video-field-note .field-note-label {
      display: inline-block;
      margin: 0 0 12px;
      font-family: "Patrick Hand", "Bradley Hand", "Segoe Print", cursive;
      font-size: 17px;
      font-style: normal;
      font-weight: 700;
      color: #1f1d1b;
      text-transform: uppercase;
      letter-spacing: .06em;
      border-bottom: 2px solid #1f1d1b;
      line-height: 1.05;
    }

    .video-field-note .video-note-title {
      margin: 0 0 12px;
      max-width: 22ch;
      color: #1f1d1b;
      font-family: "Patrick Hand", "Bradley Hand", "Segoe Print", cursive;
      font-size: clamp(2rem, 3.2vw, 3rem);
      font-style: normal;
      font-weight: 300;
      line-height: 1.08;
      letter-spacing: 0;
      text-transform: none;
      border: 0;
      text-decoration: none;
    }

    .video-field-note .video-note-description {
      max-width: 58ch;
      margin: 0;
      color: #1f1d1b;
      font-family: "Shadows Into Light", "Caveat", "Bradley Hand", cursive;
      font-size: 23px;
      font-style: normal;
      font-weight: 400;
      line-height: 1.42;
      letter-spacing: 0;
    }

    .video-field-note-action {
      align-self: center;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      white-space: nowrap;
      color: #287493;
      font-family: "Inter", sans-serif;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .video-field-note-action::before {
      content: "▶";
      display: inline-grid;
      place-items: center;
      width: 36px;
      height: 36px;
      padding-left: 2px;
      color: white;
      background: #287493;
      border-radius: 50%;
      font-size: .75rem;
      transition: transform .18s ease;
    }

    .video-field-note details[open] .video-field-note-action::before {
      content: "×";
      padding-left: 0;
      font-size: 1.25rem;
      transform: rotate(90deg);
    }

    .video-field-note details[open] .video-field-note-action-text {
      font-size: 0;
    }

    .video-field-note details[open] .video-field-note-action-text::after {
      content: "Close note";
      font-size: .78rem;
    }

    .video-field-note-media {
      position: relative;
      padding: 0 28px 28px 82px;
    }

    .video-field-note-media::before {
      content: "";
      position: absolute;
      left: 82px;
      right: 28px;
      top: -14px;
      height: 9px;
      background:
        linear-gradient(178deg, transparent 43%, #1f1d1b 45% 51%, transparent 53%) 0 0 / 88% 5px no-repeat,
        linear-gradient(181deg, transparent 46%, #1f1d1b 48% 52%, transparent 54%) 18px 4px / 73% 4px no-repeat;
      opacity: .83;
    }

    .video-field-note video {
      display: block;
      width: 100%;
      margin-top: 22px;
      background: #151515;
      border: 1px solid rgba(31,29,27,.22);
      border-radius: 8px;
      box-shadow: 0 9px 22px rgba(31,29,27,.13);
    }

    .video-field-note figcaption {
      margin-top: 10px;
      color: #57514b;
      font-family: "Inter", sans-serif;
      font-size: .78rem;
      line-height: 1.45;
    }

    .video-field-note-stack {
      display: grid;
      gap: 38px;
      margin-top: 58px;
    }

    .video-field-note-stack .video-field-note {
      margin-top: 0;
    }

    @media (prefers-reduced-motion: no-preference) {
      .video-field-note details {
        transition: box-shadow .2s ease, transform .2s ease;
      }

      .video-field-note details:hover {
        transform: rotate(0deg) translateY(-2px);
        box-shadow:
          0 20px 42px rgba(31,29,27,.13),
          0 3px 0 rgba(31,29,27,.04);
      }

      .video-field-note details:hover .field-note-clip {
        animation: clip-nudge .42s ease;
      }

      @keyframes clip-nudge {
        0%, 100% { transform: rotate(-6deg); }
        45% { transform: rotate(1deg) translateY(-2px); }
      }
    }

    @media (max-width: 700px) {
      .video-field-note {
        margin-top: 44px;
      }

      .video-field-note summary {
      font-style: normal;
        grid-template-columns: 1fr;
        min-height: 0;
        padding: 34px 22px 24px 58px;
      }

      .video-field-note .field-note-clip {
        left: 7px;
        width: 50px;
        height: 50px;
      }

      .video-field-note-action {
        justify-self: start;
      }

      .video-field-note-media {
        padding: 0 18px 20px 58px;
      }

      .video-field-note-media::before {
        left: 58px;
        right: 18px;
      }
    }
  </style>

        <section class="system-pillar">
          <div class="pillar-heading">
            <p class="eyebrow">Learn</p>
            <h3>Strengthening organizational learning.</h3>
            <p>Organizations learn more effectively when evidence accumulates, research becomes infrastructure, and user insight meaningfully informs strategy.</p>
          </div>

          <article class="learn-anchor">
            <div class="learn-anchor-grid">
              <div class="learn-anchor-copy">
                <span class="learn-anchor-label">Anchor capability</span>
                <h4>Reimagining how organizations learn from users.</h4>
                <p class="learn-anchor-project">Design With Us</p>
                <p>Like many organizations, VMware’s conference research generated participation but relatively little organizational learning or strategic alignment. Individual studies answered immediate questions, while cross-functional planning often happened within silos—or not at all—without a repeatable way for Product, Design, Engineering, and Research to identify emerging priorities together.</p>
                <p>Design With Us redesigned the research ecosystem itself. Participatory design, iterative experimentation, cross-functional collaboration, and rigorous evaluation transformed conference research into a continuously improving learning system that connected user insight to product strategy long after each event ended.</p>
                <div class="learn-anchor-metrics" aria-label="Design With Us outcomes">
                  <article><strong>98%</strong><span>Participant engagement</span></article>
                  <article><strong>1,200+</strong><span>User participants</span></article>
                  <article><strong>8</strong><span>Integrated evidence pipelines</span></article>
                </div>
              </div>
              <figure class="anchor-exhibit">
                <div class="video-embed"><iframe src="https://www.youtube.com/embed/OUitGg_GM34" title="Design Case Study: Disrupting Research with Design With Us" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>
                <figcaption class="exhibit-meta"><span class="exhibit-kicker">Exhibit 01</span><h5>Design With Us in Practice</h5><p>VMware case study showing how conference research became a scalable organizational learning system.</p></figcaption>
              </figure>
            </div>

            <section class="capability-principles" aria-labelledby="design-with-us-principles">
              <div class="capability-principles-heading"><h4 id="design-with-us-principles">What this capability makes possible.</h4><p>Three principles made tangible through the Design With Us operating model.</p></div>
              <div class="flip-card-grid">
                <article class="flip-card"><button class="flip-card-button" type="button" aria-pressed="false"><span class="flip-card-inner"><span class="flip-card-face flip-card-front"><span class="flip-card-type">Memory</span><h5>Turn user engagement into enterprise memory.</h5><span class="flip-hint">Reveal principle</span></span><span class="flip-card-face flip-card-back"><p>Rather than treating each conference as a standalone research effort, evidence, methods, and operational knowledge are accumulated across events, allowing every year to strengthen—not restart—the organization’s understanding of its users.</p><span class="flip-hint">Return</span></span></span></button></article>
                <article class="flip-card"><button class="flip-card-button" type="button" aria-pressed="false"><span class="flip-card-inner"><span class="flip-card-face flip-card-front"><span class="flip-card-type">Infrastructure</span><h5>Implement research as organizational infrastructure.</h5><span class="flip-hint">Reveal principle</span></span><span class="flip-card-face flip-card-back"><p>Research is designed as a shared organizational capability rather than a collection of individual studies. Cross-functional partnerships, standardized operating practices, and rigorous evaluation enable teams to continuously generate, integrate, and apply user evidence across products, business units, and time.</p><span class="flip-hint">Return</span></span></span></button></article>
                <article class="flip-card"><button class="flip-card-button" type="button" aria-pressed="false"><span class="flip-card-inner"><span class="flip-card-face flip-card-front"><span class="flip-card-type">Strategy</span><h5>Position evidence as a strategic capability.</h5><span class="flip-hint">Reveal principle</span></span><span class="flip-card-face flip-card-back"><p>Strategic decisions are informed by more than technical feasibility or operational metrics. User evidence becomes an integral input to how opportunities are evaluated, priorities are established, and confidence is built across disciplines—redefining what informs enterprise strategy.</p><span class="flip-hint">Return</span></span></span></button></article>
              </div>
            </section>
          </article>

          <section class="supporting-capabilities">
            <div class="supporting-section-heading"><span class="supporting-label">Supporting capabilities</span><h4>Extend learning beyond a single program.</h4><p>Two complementary systems show how the same principles apply before launch and across the broader product ecosystem.</p></div>
            <article class="supporting-capability">
              <div class="supporting-capability-copy"><h4>Feedback only creates value when it changes the product.</h4><p class="supporting-capability-project">Early Access &amp; Beta</p><p>Collecting user feedback is relatively easy. Incorporating it while a product can still change is much harder.</p><p>A mixed-methods learning system combined digital feedback, interviews, behavioral signals, and structured evaluation to transform hundreds of user observations into evidence that guided prioritization, refinement, and release readiness before general availability.</p><p class="supporting-metrics">136 users • 547 feedback submissions • 23+ follow-up interviews</p></div>
              <figure class="supporting-exhibit"><div class="supporting-exhibit-media"><div><strong>Early Access Summary Deck</strong><span>Add a representative synthesis or prioritization slide at <code>assets/img/early-access-summary.png</code>.</span></div></div><figcaption class="exhibit-meta"><span class="exhibit-kicker">Exhibit 02</span><h5>From Feedback to Readiness</h5><p>A product summary showing how qualitative and quantitative evidence were synthesized into prioritized product improvements before general availability.</p></figcaption></figure>
            </article>
            <article class="supporting-capability reverse">
